[profile.default]
# Source and output directories
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Solidity compiler configuration
solc_version = "0.8.30"
evm_version = "prague"

# Optimizer settings
optimizer = true
optimizer_runs = 200

# Additional optimizer details for gas efficiency
via_ir = false

# Gas reporting
gas_reports = ["*"]

# Formatter configuration
fmt = { line_length = 100, tab_width = 4, bracket_spacing = true }

# Remappings for dependencies
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@forge-std/=lib/forge-std/src/",
]

# Additional settings
auto_detect_solc = false
ffi = false
fs_permissions = [{ access = "read-write", path = "./" }]

# Test configuration
verbosity = 3
fuzz = { runs = 256 }

[profile.ci]
verbosity = 4
fuzz = { runs = 1000 }

[profile.lite]
optimizer = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"

[doc]
out = "docs/generated"
title = "EIP-7702 Account Abstraction Library"
